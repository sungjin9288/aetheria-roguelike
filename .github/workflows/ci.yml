name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12.12'

jobs:
  static-checks:
    name: Lint + Type-check + Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python art runtime
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements-art.txt

      - name: Install Python art dependencies
        # tests/art-asset-contract.test.js, tests/equipment-art-pipeline.test.js,
        # tests/equipment-signature-art*.test.js shell out to Pillow-based scripts
        # (scripts/*.py) — without this the unit job fails ~105 tests before any
        # assertion about the game itself runs.
        run: python -m pip install --disable-pip-version-check -r requirements-art.txt

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium (unit suite needs a browser)
        # tests/damage-feedback-restore.test.js 와 scripts/normalize-monster-source.mjs
        # (tests/monster-source-preflight.test.js 경유)는 unit 단계에서 chromium.launch()로
        # 실제 렌더를 검증한다. 브라우저가 없으면 9건이 launch 실패로 붉어진다.
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        # 2026-09 merge: the 9 byte-exact art reproducibility checks are no longer opt-in.
        # The pinned Python art runtime (requirements-art.txt) plus decoded-pixel
        # equivalence for source reconstruction make them pass on Linux, so they run
        # unconditionally again. See docs/AUDIT_REFACTOR_DEVELOP_PLAN_2026-09.md §7.
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Build guard
        run: npm run build:guard

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # playwright.config의 chromium-mobile 프로젝트는 devices['iPhone 12'] 에뮬레이션에
        # defaultBrowserType: 'chromium' 을 고정한다 — Linux headless WebKit 은 click 안정성 대기에서
        # 무기한 hang 하는 업스트림 결함(microsoft/playwright#33057)이 있어 게이트 엔진에서 제외했다.
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # mock 모드: Firebase 익명 인증 스킵 (헤드리스 환경 안정성).
          # cycle 58: ?e2e=1 URL 플래그가 mock 모드 활성.
          E2E_MODE: '1'
          # 더미 Firebase config(시크릿 아님 — 가짜값). firebase.ts가 빌드 시
          # VITE_FIREBASE_CONFIG 부재면 initializeApp({})로 앱이 부팅 못 함.
          # e2e 모드는 실제 firebase 호출을 스킵하므로 가짜 config로 부팅만 시키면 됨.
          VITE_FIREBASE_CONFIG: '{"apiKey":"e2e-key","authDomain":"e2e.firebaseapp.com","projectId":"e2e-proj","appId":"e2e"}'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # playwright.config.ts 의 reporter 는 `list` 뿐이라 playwright-report/ 는 생성되지 않는다.
          # 실패 스크린샷·error-context.md·재시도 trace.zip 은 test-results/ 에 남으므로 함께 올린다
          # (없으면 이 스텝은 "No files were found" 경고만 남기고 아무것도 보존하지 못한다).
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  perf:
    name: Perf guard (FCP/DCL budgets, non-blocking)
    runs-on: ubuntu-latest
    needs: static-checks
    # scripts/perf-guard.mjs asserts real FCP/DCL/interaction budgets but, until now, no
    # workflow ever ran it — CI truthfulness gap called out in
    # docs/AUDIT_REFACTOR_DEVELOP_PLAN_2026-09.md §7 (Track K2). continue-on-error keeps
    # this informational: a perf regression shows up red in the PR checks list without
    # blocking merges, since the budgets are not yet calibrated against CI runner noise.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        # perf-guard.mjs drives Playwright's chromium directly (not via `playwright test`),
        # so only chromium is needed here — no iPhone device emulation like the e2e job.
        run: npx playwright install --with-deps chromium

      - name: Resolve installed chromium path
        id: resolve-chromium
        # perf-guard.mjs's default executablePath is a macOS-only Chrome.app path; on Linux it
        # must be told explicitly where the browser the previous step installed actually lives.
        # Playwright itself knows this path for the currently installed browser revision, so we
        # ask it instead of hardcoding a version-specific path here.
        run: echo "path=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_OUTPUT"

      - name: Build (test API enabled)
        # perf-guard.mjs reads window.__AETHERIA_TEST_API__ perf marks (markPerf/getPerfSnapshot),
        # which are tree-shaken out of a normal production build. build:guard matches
        # scripts/local-playtest.sh's own VITE_ENABLE_TEST_API=1 build step.
        run: VITE_ENABLE_TEST_API=1 npm run build:guard
        env:
          # 더미 Firebase config — e2e job과 동일한 이유(가짜 값, 실제 호출 없음)로
          # 부팅이 initializeApp({})에서 멈추지 않도록만 채운다.
          VITE_FIREBASE_CONFIG: '{"apiKey":"e2e-key","authDomain":"e2e.firebaseapp.com","projectId":"e2e-proj","appId":"e2e"}'

      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/aetheria-preview.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Preview server did not become ready" >&2
          cat /tmp/aetheria-preview.log >&2
          exit 1

      - name: perf:guard (desktop)
        run: node scripts/perf-guard.mjs --url http://127.0.0.1:4173/
        env:
          # perf-guard.mjs launches Playwright's chromium with an explicit executablePath and,
          # if that launch fails, rethrows rather than falling back to the bundled browser — so
          # this must point at the chromium the previous step installed.
          PLAYWRIGHT_CHROME_PATH: ${{ steps.resolve-chromium.outputs.path }}

      - name: perf:guard (mobile)
        run: node scripts/perf-guard.mjs --url http://127.0.0.1:4173/ --mobile
        env:
          PLAYWRIGHT_CHROME_PATH: ${{ steps.resolve-chromium.outputs.path }}
